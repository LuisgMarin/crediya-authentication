server:
  port: 8080
spring:
  application:
    name: "crediya-authentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    io.netty: WARN
    reactor.netty: WARN
    co.com.crediya: INFO
    root: WARN
    org.springframework: WARN
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    users: "/api/v1/users"
    usersById: "/api/v1/users/{id}"
adapters:
  r2dbc:
    host: "${POSTGRES_HOST:localhost}"
    port: "${POSTGRES_PORT:5432}"
    database: "${POSTGRES_DB:db_authentication}"
    schema: "public"
    username: "${POSTGRES_USER:postgres}"
    password: "${POSTGRES_PASSWORD:crediya123}"
